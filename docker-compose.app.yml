# The installed (Home Screen) app: built web/dist + API, always running `main`.
#
# Do not start this from a working checkout. scripts/deploy-app.sh keeps a
# separate checkout of origin/main (default ~/deploy/macro-engine), builds the
# web app there and (re)starts this service from it, so the installed app is
# unaffected by whatever branch is checked out for development.
name: macro-engine-app

services:
  app:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app:ro
      # Same host DB as the MCP server and the dev API.
      - ${HOME}/.local/share/macro-engine:/root/.local/share/macro-engine
    environment:
      MACRO_ENGINE_DB: /root/.local/share/macro-engine/macros.db
      MACRO_ENGINE_HEALTH_TOKEN: ${MACRO_ENGINE_HEALTH_TOKEN:-}
    command: python -m macro_engine.http_api --host 0.0.0.0 --port 8787
    ports:
      # Bind loopback + LAN only — never 0.0.0.0 (shadows tailscale TLS listener)
      - "127.0.0.1:4332:8787"
      - "192.168.1.60:4332:8787"
    restart: unless-stopped

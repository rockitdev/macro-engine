services:
  # Python HTTP API — macro_engine.http_api (stdlib, no ASGI needed)
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app:ro
      - macro_db:/root/.local/share/macro-engine
    environment:
      MACRO_ENGINE_DB: /root/.local/share/macro-engine/macros.db
    command: python -m macro_engine.http_api --host 0.0.0.0 --port 8787
    restart: unless-stopped

  # Vite/React dev server — hot-reload, proxies /api → api:8787
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      # Bind loopback + LAN only — never 0.0.0.0 (shadows tailscale TLS listener)
      - "127.0.0.1:4325:5173"
      - "192.168.1.38:4325:5173"
    environment:
      # Proxy target when running inside Docker — service name resolves on the compose network
      VITE_API_TARGET: http://api:8787
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  web_node_modules:
  # Named volume so the DB persists across container recreates.
  # Seed it once by copying ~/.local/share/macro-engine/macros.db into the volume,
  # or start fresh (the schema is applied on connect).
  macro_db:
